name: Sync TRaSH JSON → Profillarr YAML

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # Jeden Monat am 1. um 03:00 Uhr

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq

      - name: Clone TRaSH Guides
        run: |
          git clone https://github.com/TRaSH-Guides/Guides /tmp/trash

      - name: Ensure target folders exist
        run: |
          mkdir -p custom_formats profiles regex_patterns media_management templates

      - name: Convert TRaSH JSON → YAML (Radarr + Sonarr)
        run: |
          shopt -s globstar

          # Helper function
          convert_json() {
            src="$1"
            dest="$2"

            for json in $src/**/*.json; do
              # Skip French files
              if [[ "$json" == *"french"* ]]; then
                echo "Skipping French file: $json"
                continue
              fi

              base=$(basename "${json%.json}.yml")
              yq -P eval -o=yaml "$json" > "$dest/$base"
              echo "Converted: $json → $dest/$base"
            done
          }

          # Radarr
          convert_json "/tmp/trash/docs/json/radarr/cf" "custom_formats"
          convert_json "/tmp/trash/docs/json/radarr/cf-groups" "custom_formats"
          convert_json "/tmp/trash/docs/json/radarr/naming" "media_management"
          convert_json "/tmp/trash/docs/json/radarr/quality-profile-groups" "profiles"
          convert_json "/tmp/trash/docs/json/radarr/quality-profiles" "profiles"
          convert_json "/tmp/trash/docs/json/radarr/quality-size" "profiles"

          # Sonarr
          convert_json "/tmp/trash/docs/json/sonarr/cf" "custom_formats"
          convert_json "/tmp/trash/docs/json/sonarr/cf-groups" "custom_formats"
          convert_json "/tmp/trash/docs/json/sonarr/naming" "media_management"
          convert_json "/tmp/trash/docs/json/sonarr/quality-profile-groups" "profiles"
          convert_json "/tmp/trash/docs/json/sonarr/quality-profiles" "profiles"
          convert_json "/tmp/trash/docs/json/sonarr/quality-size" "profiles"

          # Regex + Templates (global)
          convert_json "/tmp/trash/docs/json/regex" "regex_patterns"
          convert_json "/tmp/trash/docs/json/templates" "templates"

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Monthly TRaSH → YAML sync"

      - name: Push
        run: git push
